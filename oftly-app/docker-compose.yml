# UNTESTED in the build sandbox. Hosted private beta on a small server with automatic HTTPS (Caddy). Copy .env.example to .env and fill it in.
# Needs: a server, a domain name pointing at it, and ports 80/443 open. `docker compose up -d`
services:
  oftly:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: { OFTLY_COOKIE_SECURE: "1" }
    volumes: [ "oftly-data:/data" ]
    expose: [ "8000" ]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data" ]
    depends_on: [ oftly ]
volumes: { oftly-data: {}, caddy-data: {} }
